name: Validate Face

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webshader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Compile face.cu with CUDA WebShader
        run: npm run check
      - name: Build static project
        run: npm run build
